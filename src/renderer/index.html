<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Falling Object Solver</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <main class="container">
      <section class="tabs" aria-label="Simulation Pages">
        <button type="button" class="tab-button is-active" data-tab-target="motion-tab">1-dimensional motion</button>
        <button type="button" class="tab-button" data-tab-target="second-tab">Drag force</button>
      </section>

      <section id="motion-tab" class="tab-content is-active">
        <section class="panel">
          <h1>Second-Order ODE: Falling Ball</h1>
          <p class="equation">h''(t) = -g</p>
          <form id="simulation-form" class="form-grid">
            <label>
              Gravity (m/s²)
              <input id="gravity" type="number" step="0.01" min="0" value="9.81" required />
            </label>

            <label>
              Initial Height (m)
              <input id="height" type="number" step="0.01" min="0" value="100" required />
            </label>

            <label>
              Initial Velocity Magnitude (m/s)
              <input id="velocity" type="number" step="0.01" min="0" value="0" required />
            </label>

            <label>
              Initial Velocity Direction
              <select id="velocity-direction">
                <option value="up">Up</option>
                <option value="down" selected>Down</option>
              </select>
            </label>

            <label>
              Time Step (s)
              <input id="time-step" type="number" step="0.001" min="0.001" value="0.1" required />
            </label>

            <div class="actions">
              <button type="submit">Run Simulation</button>
            </div>
          </form>
          <p id="error-message" class="error-message"></p>
        </section>

        <section class="panel">
          <h2>Height and Velocity vs Time</h2>
          <canvas id="result-chart"></canvas>
        </section>

        <section class="panel table-panel">
          <h2>Simulation Table</h2>
          <div class="table-wrapper">
            <table id="result-table">
              <thead>
                <tr>
                  <th>Time (s)</th>
                  <th>Height (m)</th>
                  <th>Velocity (m/s)</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </section>

      <section id="second-tab" class="tab-content">
        <section class="panel">
          <h2>Drag force</h2>
          <p class="equation">D = 1/2 Cd rho A v^2</p>
          <form id="drag-form" class="form-grid">
            <label>
              Mass (kg)
              <input id="drag-mass" type="number" step="0.01" min="0.01" value="80" required />
            </label>

            <label>
              Gravity (m/s²)
              <input id="drag-gravity" type="number" step="0.01" min="0.01" value="9.81" required />
            </label>

            <label>
              Drag Coefficient (Cd)
              <input id="drag-cd" type="number" step="0.01" min="0.01" value="1.0" required />
            </label>

            <label>
              Air Density (rho, kg/m³)
              <input id="drag-rho" type="number" step="0.001" min="0.001" value="1.225" required />
            </label>

            <label>
              Reference Area (m²)
              <input id="drag-area" type="number" step="0.001" min="0.001" value="0.7" required />
            </label>

            <label>
              Velocity Magnitude (m/s)
              <input id="drag-velocity" type="number" step="0.01" min="0" value="53" required />
            </label>

            <div class="actions">
              <button type="submit">Calculate</button>
            </div>
          </form>

          <p id="drag-error-message" class="error-message"></p>

          <div id="drag-results" class="drag-results" hidden>
            <p><strong>Weight (W = mg):</strong> <span id="result-weight"></span> N</p>
            <p><strong>Drag Force (D):</strong> <span id="result-drag"></span> N</p>
            <p><strong>Net Force (W - D):</strong> <span id="result-net"></span> N</p>
            <p><strong>Acceleration (a = (W - D)/m):</strong> <span id="result-acceleration"></span> m/s²</p>
            <p><strong>Terminal Velocity (vt):</strong> <span id="result-terminal"></span> m/s</p>
          </div>
        </section>
      </section>
    </main>

    <script src="simulationViewModel.js"></script>
    <script src="app.js"></script>
  </body>
</html>
