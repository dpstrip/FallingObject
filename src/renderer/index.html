<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Falling Object Solver</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <main class="container">
      <section class="tabs" aria-label="Simulation Pages">
        <button type="button" class="tab-button is-active" data-tab-target="motion-tab">1-dimensional motion</button>
        <button type="button" class="tab-button" data-tab-target="drag-tab">Drag force</button>
      </section>

      <section id="motion-tab" class="tab-content is-active" data-simulation-tab data-simulation-type="basic">
        <section class="panel">
          <h1>Second-Order ODE: Falling Ball</h1>
          <p class="equation">h''(t) = -g</p>
          <form class="form-grid" data-role="simulation-form">
            <label>
              Gravity (m/s²)
              <input data-field="gravity" type="number" step="0.01" min="0" value="9.81" required />
            </label>

            <label>
              Initial Height (m)
              <input data-field="height" type="number" step="0.01" min="0" value="100" required />
            </label>

            <label>
              Initial Velocity Magnitude (m/s)
              <input data-field="velocity" type="number" step="0.01" min="0" value="0" required />
            </label>

            <label>
              Initial Velocity Direction
              <select data-field="velocity-direction">
                <option value="up">Up</option>
                <option value="down" selected>Down</option>
              </select>
            </label>

            <label>
              Time Step (s)
              <input data-field="time-step" type="number" step="0.001" min="0.001" value="0.1" required />
            </label>

            <div class="actions">
              <button type="submit">Run Simulation</button>
            </div>
          </form>
          <p class="error-message" data-role="error-message"></p>
        </section>

        <section class="panel">
          <h2>Height and Velocity vs Time</h2>
          <canvas data-role="result-chart"></canvas>
        </section>

        <section class="panel table-panel">
          <h2>Simulation Table</h2>
          <div class="table-wrapper">
            <table data-role="result-table">
              <thead>
                <tr>
                  <th>Time (s)</th>
                  <th>Height (m)</th>
                  <th>Velocity (m/s)</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </section>

      <section id="drag-tab" class="tab-content" data-simulation-tab data-simulation-type="drag">
        <section class="panel">
          <h1>Second-Order ODE: Falling Ball with Drag</h1>
          <p class="equation">m dv/dt = m g - 1/2 Cd rho A v^2</p>
          <form class="form-grid" data-role="simulation-form">
            <label>
              Mass (kg)
              <input data-field="mass" type="number" step="0.01" min="0.01" value="80" required />
            </label>

            <label>
              Gravity (m/s²)
              <input data-field="gravity" type="number" step="0.01" min="0" value="9.81" required />
            </label>

            <label>
              Drag Coefficient (Cd)
              <input data-field="drag-coefficient" type="number" step="0.01" min="0.01" value="1" required />
            </label>

            <label>
              Air Density (kg/m³)
              <input data-field="fluid-density" type="number" step="0.001" min="0.001" value="1.225" required />
            </label>

            <label>
              Reference Area (m²)
              <input data-field="reference-area" type="number" step="0.001" min="0.001" value="0.7" required />
            </label>

            <label>
              Initial Height (m)
              <input data-field="height" type="number" step="0.01" min="0" value="100" required />
            </label>

            <label>
              Initial Velocity Magnitude (m/s)
              <input data-field="velocity" type="number" step="0.01" min="0" value="0" required />
            </label>

            <label>
              Initial Velocity Direction
              <select data-field="velocity-direction">
                <option value="up">Up</option>
                <option value="down" selected>Down</option>
              </select>
            </label>

            <label>
              Time Step (s)
              <input data-field="time-step" type="number" step="0.001" min="0.001" value="0.1" required />
            </label>

            <div class="actions">
              <button type="submit">Run Simulation</button>
            </div>
          </form>
          <p class="equation-details" data-role="terminal-velocity"></p>
          <p class="error-message" data-role="error-message"></p>
        </section>

        <section class="panel">
          <h2>Height and Velocity vs Time</h2>
          <canvas data-role="result-chart"></canvas>
        </section>

        <section class="panel table-panel">
          <h2>Simulation Table</h2>
          <div class="table-wrapper">
            <table data-role="result-table">
              <thead>
                <tr>
                  <th>Time (s)</th>
                  <th>Height (m)</th>
                  <th>Velocity (m/s)</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <script src="simulationViewModel.js"></script>
    <script src="app.js"></script>
  </body>
</html>
